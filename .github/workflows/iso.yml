name: experimental-iso
on:
  push:
    branches: [ codex/graphical-iso ]
    paths: [ 'iso/**', 'forge/iso_*.py', 'tests/test_iso*.py', '.github/workflows/iso.yml' ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git cmake ninja extra-cmake-modules qt6-base qt6-declarative qt6-svg qt6-tools yaml-cpp kcoreaddons kconfig kpmcore polkit-qt6 python python-yaml boost boost-libs libpwquality icu hwinfo pyside6 python-pillow xorg-server-xvfb xorg-xauth dbus ttf-jetbrains-mono-nerd archiso scrot sddm
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -p 'test_iso*.py' -v
      - uses: actions/cache@v4
        id: calamares-cache
        with:
          path: iso/calamares/calamares-[0-9]*.pkg.tar.zst
          key: forge-calamares-${{ hashFiles('iso/calamares/PKGBUILD') }}
      - name: Render welcome and app picker
        run: |
          QT_QUICK_BACKEND=software timeout 30 xvfb-run -a -s '-screen 0 1280x800x24' python -m forge.iso_welcome --preview --screenshot test-results/iso-welcome.png
          QT_QUICK_BACKEND=software timeout 30 xvfb-run -a -s '-screen 0 1280x800x24' python -m forge.iso_welcome --preview --preview-page apps --screenshot test-results/iso-app-picker.png
      - name: Build Calamares package
        if: steps.calamares-cache.outputs.cache-hit != 'true'
        run: |
          useradd -m forgebuild
          chown -R forgebuild:forgebuild iso/calamares
          cd iso/calamares
          runuser -u forgebuild -- makepkg --noconfirm
      - run: |
          pacman -U --noconfirm iso/calamares/calamares-[0-9]*.pkg.tar.zst
          QT_QPA_PLATFORM=offscreen calamares --version
      - name: Verify the live profile and load the graphical installer
        run: |
          mkdir -p /tmp/forge-profile-check/repository
          touch /tmp/forge-profile-check/repository/forge.db.tar.gz
          cp -a /usr/share/archiso/configs/releng /tmp/forge-profile-check/profile
          python iso/prepare.py "$PWD" /tmp/forge-profile-check/profile /tmp/forge-profile-check/repository
          cp -a /tmp/forge-profile-check/profile/airootfs/etc/calamares /etc/
          mkdir -p /opt
          ln -s "$PWD" /opt/hyprland-forge
          QT_QUICK_BACKEND=software xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- python tests/validate-iso-calamares.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-installer-components
          path: |
            iso/calamares/calamares-[0-9]*.pkg.tar.zst
            test-results/iso-*.png
            test-results/iso-*.log
  image:
    if: contains(github.event.head_commit.message, '[build-iso]')
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: archlinux:base
      options: --privileged
    steps:
      - run: pacman -Syu --noconfirm --needed archiso git python python-pillow qemu-system-x86 qemu-img qemu-hw-display-virtio-vga edk2-ovmf
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: forge-installer-components
          path: /tmp/forge-components
      - run: bash iso/build.sh /tmp/forge-components/iso/calamares/calamares-[0-9]*.pkg.tar.zst /tmp/forge-iso-work /tmp/forge-iso-output
      - uses: actions/upload-artifact@v4
        with:
          name: forge-experimental-iso
          path: /tmp/forge-iso-output/
          compression-level: 0
          retention-days: 7
      - name: Boot the ISO in a disposable UEFI VM
        run: python iso/boot_vm.py /tmp/forge-iso-output/*.iso /tmp/forge-iso-boot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-iso-boot-captures
          path: |
            /tmp/forge-iso-boot/*.png
            /tmp/forge-iso-boot/*.log
            /tmp/forge-iso-boot/*.json
  boot-existing:
    if: contains(github.event.head_commit.message, '[boot-iso]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: archlinux:base
      options: --privileged
    steps:
      - run: pacman -Syu --noconfirm --needed git python python-pillow qemu-system-x86 qemu-img qemu-hw-display-virtio-vga edk2-ovmf
      - uses: actions/checkout@v4
      - id: source
        run: python -c 'import json,os; run=json.load(open("iso/state.json"))["last_built_run"]; assert type(run) is int and run>0; open(os.environ["GITHUB_OUTPUT"],"a").write("run="+str(run)+"\n")'
      - uses: actions/download-artifact@v4
        with:
          name: forge-experimental-iso
          path: /tmp/forge-existing-iso
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - run: cd /tmp/forge-existing-iso && sha256sum -c SHA256SUMS
      - run: python iso/boot_vm.py /tmp/forge-existing-iso/*.iso /tmp/forge-iso-boot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-iso-boot-captures
          path: |
            /tmp/forge-iso-boot/*.png
            /tmp/forge-iso-boot/*.log
            /tmp/forge-iso-boot/*.json
