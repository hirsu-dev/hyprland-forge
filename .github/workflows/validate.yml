name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh live.sh
      - run: bash install.sh --plan --json
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed git python python-pillow python-dbus-next lua hyprland shellcheck quickshell xorg-server-xvfb xorg-xauth ttf-jetbrains-mono-nerd sway swaybg grim librsvg fuzzel kitty qt6ct papirus-icon-theme pipewire pipewire-audio wireplumber
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -v
      - run: lua tests/test_layout.lua
      - run: lua tests/test_monitors.lua
      - run: shellcheck install.sh live.sh configs/bin/forge-session configs/bin/forge-wallpaper configs/bin/forge-launcher configs/bin/forge-screenshot tests/*.sh
      - run: bash tests/validate-fuzzel.sh
      - run: kitty +runpy 'import runpy; runpy.run_path("tests/validate-appearance.py")'
      - run: python -c 'import json,subprocess; p=json.load(open("project.json")); subprocess.run(["pacman","-Si","--", *sorted({n for s in p["stages"] for n in s.get("packages",[])})],check=True)'
      - run: |
          luac -p configs/hypr/hyprland.lua configs/hypr/forge/layout.lua configs/hypr/forge/monitors.lua
          pacman -Q hyprland quickshell
      - run: xvfb-run -a dbus-run-session -- bash tests/smoke-shell.sh
      - run: |
          mkdir -p /tmp/forge-wayland/runtime test-results
          chmod 700 /tmp/forge-wayland/runtime
          chown -R nobody:nobody /tmp/forge-wayland test-results
          setcap -r /usr/bin/sway
          runuser -u nobody -- env HOME=/tmp/forge-wayland XDG_RUNTIME_DIR=/tmp/forge-wayland/runtime dbus-run-session -- bash tests/smoke-wayland.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-runtime-logs
          path: test-results/
  compositor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed git python hyprland gdb
      - uses: actions/checkout@v4
      - run: bash tests/verify-hyprland.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compositor-validation
          path: test-results/
  bundle:
    needs: [validation, arch, compositor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m forge.bundle --output test-results/bundle
      - run: |
          cd test-results/bundle
          sha256sum -c *.sha256
          tar -xzf *.tar.gz
          cd hyprland-forge
          sha256sum -c SHA256SUMS
          bash install.sh --plan --json
      - uses: actions/upload-artifact@v4
        with:
          name: hyprland-forge-installer
          path: |
            test-results/bundle/*.tar.gz
            test-results/bundle/*.sha256
