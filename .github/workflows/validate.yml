name: validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: for script in install.sh install-online.sh live.sh; do bash -n "$script"; done
      - run: bash install.sh --plan --json
  arch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed git python python-pillow python-pyqt6 python-dbus-next lua hyprland shellcheck quickshell xorg-server-xvfb xorg-xauth ttf-jetbrains-mono-nerd sway swaybg grim librsvg fuzzel kitty qt6ct papirus-icon-theme pipewire pipewire-audio wireplumber sddm cliphist wl-clipboard xdg-utils libnotify archinstall sudo grub
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s tests -v
      - run: python tests/validate-login.py
      - run: python tests/validate-setup.py
      - run: PYTHONPATH=. python tests/validate-boot-build.py
      - run: xvfb-run -a -s '-screen 0 1920x1080x24' python tests/validate-boot-login.py
      - run: lua tests/test_layout.lua
      - run: lua tests/test_monitors.lua
      - run: lua tests/test_tiling.lua
      - run: shellcheck install.sh install-online.sh live.sh configs/bin/forge-session configs/bin/forge-wallpaper configs/bin/forge-launcher configs/bin/forge-screenshot configs/bin/forge-update configs/bin/forge-optional configs/bin/forge-backlight tests/*.sh
      - run: bash tests/validate-fuzzel.sh
      - run: kitty +runpy 'import runpy; runpy.run_path("tests/validate-appearance.py")'
      - run: python -c 'import json,subprocess; p=json.load(open("project.json")); subprocess.run(["pacman","-Si","--", *sorted({n for s in p["stages"] for n in s.get("packages",[])})],check=True)'
      - run: |
          luac -p configs/hypr/hyprland.lua configs/hypr/forge/*.lua
          pacman -Q hyprland quickshell
      - run: xvfb-run -a dbus-run-session -- bash tests/smoke-shell.sh
      - run: |
          mkdir -p /tmp/forge-wayland/runtime test-results
          chmod 700 /tmp/forge-wayland/runtime
          chown -R nobody:nobody /tmp/forge-wayland test-results
          setcap -r /usr/bin/sway
          runuser -u nobody -- env HOME=/tmp/forge-wayland XDG_RUNTIME_DIR=/tmp/forge-wayland/runtime dbus-run-session -- bash tests/smoke-wayland.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shell-runtime-logs
          path: test-results/
  compositor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: archlinux:base
    steps:
      - run: pacman -Syu --noconfirm --needed git python hyprland gdb
      - uses: actions/checkout@v4
      - run: bash tests/verify-hyprland.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compositor-validation
          path: test-results/
  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y grub-efi-amd64-bin grub-common qemu-system-x86 ovmf mtools dosfstools fonts-dejavu-core
      - run: python -m pip install pillow
      - run: PYTHONPATH=. python tests/validate-boot-uefi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-experience-validation
          path: test-results/boot-uefi/
  bundle:
    needs: [validation, arch, compositor, boot, native-boot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m forge.bundle --output test-results/bundle
      - run: |
          cd test-results/bundle
          sha256sum -c *.sha256
          tar -xzf *.tar.gz
          cd hyprland-forge
          sha256sum -c SHA256SUMS
          bash install.sh --plan --json
      - uses: actions/upload-artifact@v4
        with:
          name: hyprland-forge-installer
          path: |
            test-results/bundle/*.tar.gz
            test-results/bundle/*.sha256
  native-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: rustup target add x86_64-unknown-uefi
      - run: python -m pip install pillow
      - run: PYTHONPATH=. python tests/validate-native-build.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-startup-validation
          path: |
            test-results/native-startup/preview/*.png
            test-results/native-startup/intro.gif
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hyprland-forge-installer
          path: test-results/bundle
      - run: |
          python -c 'import json,os; assert os.environ["FORGE_TAG"] == "v" + json.load(open("project.json"))["release"]'
          gh release create "$FORGE_TAG" test-results/bundle/*.tar.gz test-results/bundle/*.sha256 --prerelease --title "Hyprland Forge $FORGE_TAG" --notes 'Arch installer candidate. NVIDIA, HDMI 120 Hz and suspend/resume require on-device validation.'
        env:
          GH_TOKEN: ${{ github.token }}
          FORGE_TAG: ${{ github.ref_name }}
