---
modules-search: [ /etc/calamares/modules, local ]
branding: forge
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
sequence:
  - show: [ welcome, locale, keyboard, partition, users, summary ]
  - exec: [ forgeguard, partition, mount, forgebase, machineid, locale, keyboard, localecfg, fstab, users, networkcfg, hwclock, initcpiocfg, forgefinish, initcpio, grubcfg, bootloader, umount ]
  - show: [ finished ]
