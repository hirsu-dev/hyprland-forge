[package]
name = "forge-startup"
version = "0.1.0"
edition = "2024"
publish = false

[features]
firmware = ["dep:uefi"]
firmware-test = ["firmware"]
preview = []

[dependencies]
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac", "sha2"] }
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.8.2", default-features = false }
uefi = { version = "0.41.0", optional = true, features = ["alloc", "global_allocator", "panic_handler"] }

[[bin]]
name = "forge-startup"
path = "src/main.rs"
required-features = ["firmware"]

[[bin]]
name = "forge-preview"
path = "src/preview.rs"
required-features = ["preview"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
